openapi: 3.0.3
info:
  title: Simple Line Access Protocol (SLAP2)
  description: |
    The Simple Line Access Protocol (SLAP) is an IVOA Data Access protocol
    for retrieving spectral lines from Spectral Line Data Collections through
    a uniform interface within the Virtual Observatory framework.

    This OpenAPI document describes the SLAP2 standard interface.
    Service implementations may add service-specific parameters beyond those
    listed here (marked with `x-slap-standard: false`).

    Responses are returned as VOTable 1.5 XML documents (`application/x-votable+xml`).
    Parameter names are case-sensitive. Interval parameters accept a space-separated pair
    of values (`min max`), with `-Inf` and `+Inf` supported for open-ended ranges.
    Pattern parameters use shell wildcard syntax: `*` (any sequence), `?` (any character),
    `[seq]` (character class). Multiple occurrences of the same parameter are combined
    with OR semantics.

    Reference: https://www.ivoa.net/documents/SLAP/
  version: "2.0"

paths:
  /lines:
    get:
      summary: Query spectral lines
      description: |
        Returns a VOTable listing spectral lines matching the given criteria.
        The `WAVELENGTH` parameter is mandatory.

        Service protocol identifier: `ivo://ivoa.net/std/SLAP#lines-2.0`
      operationId: getLines
      parameters:
        - name: WAVELENGTH
          in: query
          required: true
          x-slap-standard: true
          description: |
            Vacuum wavelength range in metres (interval).
            Provide a space-separated interval (`min max`), a single value,
            or use `-Inf`/`+Inf` for open-ended ranges.
            Corresponding VAMDC restrictable: `RadTransWavelength`.
          schema:
            type: string
          examples:
            single:
              summary: Single wavelength
              value: "2.3e-7"
            range:
              summary: Wavelength range
              value: "5.1e-6 5.6e-6"
            open_upper:
              summary: Open-ended upper bound
              value: "2.0e-7 +Inf"

        - name: SPECIES
          in: query
          required: false
          x-slap-standard: true
          description: |
            Constrains the search to the selected species (pattern matching).
            Can be an atom symbol, atom name, or molecular formula/name.
            Corresponding VAMDC restrictables: `AtomSymbol`, `MoleculeChemicalName`,
            `MoleculeOrdinaryStructuralFormula`. Wildcard is not supported in /lines.
          schema:
            type: string
          examples:
            atom:
              summary: Iron atom
              value: "Fe"
            molecule:
              summary: Carbon dioxide
              value: "CO2"

        - name: SPECIES_MASS
          in: query
          required: false
          x-slap-standard: true
          description: |
            Molecular mass of the species (interval), in Unified Atomic Mass Unit (u).
            Float value greater than 0.
            Corresponding VAMDC restrictables: `AtomMass`, `MoleculeMolecularWeight`.
          schema:
            type: string
          example: "28 30"

        - name: INCHIKEY
          in: query
          required: false
          x-slap-standard: true
          description: |
            InChIKey identifier of the species (exact match).
            The InChIKey is a 27-character string.
            Note: different isotopologues have different InChIKeys.
            Corresponding VAMDC restrictable: `InchiKey`.
          schema:
            type: string
          example: 
            molecule:
              summary : Carbon monoxide
              value : "UGFAIRIUMAVXCW-UHFFFAOYSA-N"

        - name: ION_CHARGE
          in: query
          required: false
          x-slap-standard: true
          description: |
            Ion charge (interval, integer). Use a space-separated range or single value.
            Positive for ionized species, negative for anions (excess electrons),
            0 for neutral species. If SPECIES is also specified, applies to that species only.
            Corresponding VAMDC restrictable: `IonCharge`.
          schema:
            type: string
          example: "0 1"

        - name: LOWER_LEVEL_ENERGY
          in: query
          required: false
          x-slap-standard: true
          description: |
            Energy of the lower level of the transition, in Joules (interval).
            Corresponding VAMDC restrictable: `StateEnergy`.
          schema:
            type: string
          example: "3.93e-18 3.94e-18"

        - name: UPPER_LEVEL_ENERGY
          in: query
          required: false
          x-slap-standard: true
          description: |
            Energy of the upper level of the transition, in Joules (interval).
            Corresponding VAMDC restrictable: `StateEnergy`.
          schema:
            type: string
          example: "3.93e-18 3.94e-18"

        - name: EINSTEINA
          in: query
          required: false
          x-slap-standard: true
          description: |
            Einstein A coefficient range in s⁻¹ (interval).
            Probability per unit time for spontaneous emission in a bound-bound transition.
            Corresponding VAMDC restrictable: `RadTransProbabilityA`.
          schema:
            type: string
          example: "1.1e-7 1.2e-7"

        - name: MAXREC
          in: query
          required: false
          x-slap-standard: true
          description: |
            Maximum number of records to return. Single integer value.
            If the result is truncated, the server MUST set `QUERY_STATUS` to `OVERFLOW`.
            Special case: `MAXREC=0` returns metadata only (no data rows).
          schema:
            type: integer
            minimum: 0
          example: 1000

        - name: RESPONSEFORMAT
          in: query
          required: false
          x-slap-standard: true
          description: |
            RESPONSEFORMAT allows the client to specify the format of the response. 
            Only the VOTable format is supported.
          schema:
            type: string
            enum : [application/x-votable+xml, text/xml]

      responses:
        "200":
          description: |
            VOTable with matching spectral lines, or an empty result set.
            `QUERY_STATUS` in the VOTable INFO element indicates `OK`, `OVERFLOW`, or `ERROR`.
          headers:
            Content-Disposition:
              description: Suggested filename for the downloaded VOTable.
              schema:
                type: string
                example: 'attachment; filename="lines.xml"'
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/LinesVOTable"

        "204":
          description: No matching lines found.

        "400":
          description: Bad request — missing or invalid parameters.
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/ErrorVOTable"

        "500":
          description: Internal server error.
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/ErrorVOTable"

  /species:
    get:
      summary: Query species
      description: |
        Returns a VOTable listing chemical species available in the database.
        No parameters are mandatory. Without any filter, the full species catalogue
        is returned.

        Service protocol identifier: `ivo://ivoa.net/std/SLAP#species-2.0`
      operationId: getSpecies
      parameters:
        - name: SPECIES_TYPE
          in: query
          required: false
          x-slap-standard: true
          description: |
            Type of species: `atom` or `molecule` (exact match).
            If omitted, both atoms and molecules are returned.
          schema:
            type: string
            enum: [atom, molecule]
          example: "molecule"

        - name: INCHIKEY
          in: query
          required: false
          x-slap-standard: true
          description: |
            InChIKey identifier of the species (exact match).
            Tests the existence of a given InChIKey in the service data.
            Corresponding VAMDC restrictable: `InchiKey`.
          schema:
            type: string
          example: "UFHFLCQGNIYNRP-UHFFFAOYSA-N"

        - name: INCHI
          in: query
          required: false
          x-slap-standard: true
          description: |
            InChI identifier of the species (pattern matching).
            Allows searching for isotopologues by providing a partial InChI.
          schema:
            type: string
          example: "1S/H2/h1H"

        - name: NUMBER_OF_ATOMS
          in: query
          required: false
          x-slap-standard: true
          description: |
            Number of atoms in the species (interval, integer).
            Use a single value or a space-separated range.
          schema:
            type: string
          examples:
            diatomic:
              summary: Diatomic molecules only
              value: "2"
            range:
              summary: Molecules with 2 to 5 atoms
              value: "2 5"

        - name: SPECIES
          in: query
          required: false
          x-slap-standard: true
          description: |
            Chemical name or structural formula (pattern matching).
            Corresponding VAMDC restrictables: `AtomSymbol`, `MoleculeChemicalName`,
            `MoleculeOrdinaryStructuralFormula`.
          schema:
            type: string
          examples:
            prefix:
              summary: All species starting with CO
              value: "CO*"
            suffix:
              summary: All species ending with OH
              value: "*OH"

        - name: STOICHIOMETRIC_FORMULA
          in: query
          required: false
          x-slap-standard: true
          description: |
            Stoichiometric formula of the species (pattern matching).
            Corresponding VAMDC restrictable: `MoleculeStoichiometricFormula`.
          schema:
            type: string
          example: "CO*"

      responses:
        "200":
          description: |
            VOTable with matching species, or an empty result set.
            `QUERY_STATUS` in the VOTable INFO element indicates `OK`, `OVERFLOW`, or `ERROR`.
          headers:
            Content-Disposition:
              description: Suggested filename for the downloaded VOTable.
              schema:
                type: string
                example: 'attachment; filename="species.xml"'
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/SpeciesVOTable"

        "204":
          description: No matching species found.

        "400":
          description: Bad request — invalid parameters.
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/ErrorVOTable"

        "500":
          description: Internal server error.
          content:
            application/x-votable+xml:
              schema:
                $ref: "#/components/schemas/ErrorVOTable"

components:
  schemas:
    LinesVOTable:
      type: object
      description: |
        VOTable 1.5 document containing spectral line data.

        The `RESOURCE` element (type="results") MUST contain:
        - INFO elements with metadata
        - A single TABLE element with one TR row per matching line

        **INFO fields:**
        | Name | Description |
        |------|-------------|
        | QUERY_STATUS | `OK`, `OVERFLOW`, or `ERROR` |
        | request_date | ISO 8601 UTC timestamp of the request |
        | request | URL-encoded original SLAP query |
        | service_ivoid | `ivo://myvo.org/slap2` |
        | service_protocol | `ivo://ivoa.net/std/SLAP#lines-2.0` |
        | last_update_date | Date of last database update |
        | publisher | Data publisher name |

        **TABLE columns (MUST = mandatory, SHOULD = recommended, MAY = optional):**
        | Name | Type | Unit | UCD | Requirement | Nullable | VAMDC Returnable |
        |------|------|------|-----|-------------|----------|-----------------|
        | vacuum_wavelength | double | m | em.wl | **MUST** | NO | RadTransWavelength |
        | vacuum_wavelength_error | double | m | stat.error;em.wl | **MUST** | YES | RadTransWavelengthAccuracy |
        | observed_wavelength | double | m | em.wl | **MAY** | YES | RadTransWavelength (observed) |
        | line_title | char | — | meta.title | **MUST** | NO | RadTransComment |
        | species_name | char | — | phys.atmol.element | **MUST** | NO | AtomSymbol, MoleculeChemicalName |
        | species_mass | float | u | phys.mass | **MAY** | YES | AtomMass, MoleculeMolecularWeight |
        | inchikey | char | — | phys.atmol.element | **MUST** | NO | AtomInchiKey, MoleculeInchiKey |
        | inchi | char | — | phys.atmol.element | **MUST** | NO | AtomInchi, MoleculeInchi |
        | ion_charge | int | — | phys.atmol.element;phys.atmol.ionization | **MUST** | NO | AtomIonCharge, MoleculeIonCharge |
        | lower_level_description | char | — | meta.title;phys.atmol.level | **MUST** | YES | AtomStateDescription, MoleculeStateDescription |
        | upper_level_description | char | — | meta.title;phys.atmol.level | **MUST** | YES | AtomStateDescription, MoleculeStateDescription |
        | einsteina | double | s⁻¹ | phys.atmol.transProb | **MAY** | YES | RadTransProbabilityA |
        | lower_level_energy | double | J | phys.energy;phys.atmol.level | **MAY** | YES | StateEnergy |
        | upper_level_energy | double | J | phys.energy;phys.atmol.level | **MAY** | YES | StateEnergy |
        | reference_doi | char | — | meta.ref.doi | **SHOULD** | YES | SourceDOI |
        | reference_uri | char | — | meta.ref.uri | **SHOULD** | YES | SourceURI |
        | reference_additional_uri | char | — | meta.ref.uri | **MAY** | YES | SourceURI |
        | vacuum_wavelength_original | double | (original) | em.wl | **MAY** | YES | RadTransWavelength |
        | vacuum_wavelength_error_original | double | (original) | stat.error;em.wl | **MAY** | YES | RadTransWavelengthAccuracy |
        | lower_energy_original | double | (original) | phys.energy;phys.atmol.level | **MAY** | YES | StateEnergy |
        | upper_energy_original | double | (original) | phys.energy;phys.atmol.level | **MAY** | YES | StateEnergy |
      xml:
        name: VOTABLE
      externalDocs:
        description: VOTable 1.5 specification
        url: https://www.ivoa.net/documents/VOTable/

    SpeciesVOTable:
      type: object
      description: |
        VOTable 1.5 document containing species data.

        **INFO fields:**
        | Name | Description |
        |------|-------------|
        | QUERY_STATUS | `OK`, `OVERFLOW`, or `ERROR` |
        | request_date | ISO 8601 UTC timestamp of the request |
        | request | URL-encoded original SLAP query |
        | service_protocol | `ivo://ivoa.net/std/SLAP#species-2.0` |
        | last_update_date | Date of last database update |
        | publisher | Data publisher name |

        **TABLE columns:**
        | Name | Type | Unit | UCD | Requirement | Nullable |
        |------|------|------|-----|-------------|----------|
        | species_name | char | — | phys.atmol.element | **MUST** | NO |
        | ion_charge | int | — | phys.atmol.element;phys.atmol.ionization | **MUST** | NO |
        | inchikey | char | — | phys.atmol.element | **MUST** | NO |
        | inchi | char | — | phys.atmol.element | **MUST** | NO |
        | stoichiometric_formula | char | — | phys.atmol.element | **MUST** | YES |
        | species_type | char | — | — | **SHOULD** | YES |
        | number_of_atoms | int | — | — | **SHOULD** | YES |
      xml:
        name: VOTABLE
      externalDocs:
        description: VOTable 1.5 specification
        url: https://www.ivoa.net/documents/VOTable/

    ErrorVOTable:
      type: object
      description: |
        VOTable 1.5 document with `QUERY_STATUS` INFO set to `ERROR` and a
        human-readable error message. Returned when a parameter is invalid or
        unsupported (e.g., "Parameter TEMPERATURE is not supported by this service").
      xml:
        name: VOTABLE
